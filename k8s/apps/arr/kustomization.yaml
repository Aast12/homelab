apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flaresolverr.yaml
  - prowlarr.yaml
  - sonarr.yaml
  - radarr.yaml
  - lidarr.yaml
  - bazarr.yaml
  - jellyseerr.yaml
  - downloads.yaml
  - setup.yaml
# Names get a hash of their content, so changing secrets.env or the scripts
# restarts the apps that use them and re-runs the setup Job.
secretGenerator:
  - name: arr
    namespace: media
    envs: [secrets.env]
configMapGenerator:
  - name: media-setup
    namespace: media
    files:
      - setup/setup.py
      - setup/download_logins.py
