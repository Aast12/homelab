apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
configMapGenerator:
  # the code; its name changes with its content, so a change restarts the pod
  - name: nubank-import-app
    namespace: finance
    files:
      - app/nubank_import.py
      - app/requirements.txt
secretGenerator:
  - name: nubank-import
    namespace: finance
    envs: [secrets.env]
    options:
      disableNameSuffixHash: true
