apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
configMapGenerator:
  # the code; its name changes with its content, so a change restarts the pod
  - name: syncfy-bridge-app
    namespace: finance
    files:
      - app/syncfy_bridge.py
secretGenerator:
  - name: syncfy-bridge
    namespace: finance
    envs: [secrets.env]
    options:
      disableNameSuffixHash: true
