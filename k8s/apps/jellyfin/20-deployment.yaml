apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  labels:
    app.kubernetes.io/name: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate                          # the config volume is ReadWriteOnce
  selector:
    matchLabels:
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin
    spec:
      # media nodes only: `lab.sh node <type> --media <host>` makes one
      nodeSelector:
        lab.alamst.me/media: "true"
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:12.4.20261026-211555
          env:
            - name: TZ
              value: America/Mexico_City
            - name: JELLYFIN_PublishedServerUrl
              value: https://jellyfin.lab.alamst.me
          ports:
            - name: http
              containerPort: 8096
          securityContext:
            # shortcut for the Intel GPU at /dev/dri (Quick Sync transcoding);
            # the proper way is the Intel GPU device plugin
            privileged: true
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: cache,  mountPath: /cache }
            # /data, as in the old Compose stack and the arr apps, so library
            # paths in a migrated config stay valid
            - { name: media,  mountPath: /data, readOnly: true }
            - { name: dri,    mountPath: /dev/dri }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60            # up to 5 minutes for the first start
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits:   { memory: 4Gi }
      volumes:
        - name: config
          persistentVolumeClaim: { claimName: jellyfin-config }
        - name: media
          persistentVolumeClaim: { claimName: media-library }
        - name: cache
          emptyDir: {}                      # transcodes and image cache, gone with the Pod
        - name: dri
          hostPath: { path: /dev/dri, type: Directory }
