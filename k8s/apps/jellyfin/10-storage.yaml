# The media library already exists on disk, so it is described by hand
# (static provisioning) instead of created by a StorageClass.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-library
spec:
  capacity:
    storage: 500Gi                          # informational for local volumes
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain     # never delete the files with the claim
  storageClassName: manual-local
  local:
    path: /data/media
  # Where the files physically are. This names the machine, not the media
  # label: a second media node would not have these files.
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [k3s-01]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-library
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: manual-local
  volumeName: media-library
  resources:
    requests:
      storage: 500Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
