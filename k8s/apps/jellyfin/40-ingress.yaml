# Same as every other web app: the name needs no DNS entry, because the Pi's
# Traefik forwards every lab.alamst.me name it does not serve to the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin
  namespace: media
spec:
  ingressClassName: traefik
  tls:
    - hosts: [jellyfin.lab.alamst.me]
  rules:
    - host: jellyfin.lab.alamst.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin
                port:
                  name: http
