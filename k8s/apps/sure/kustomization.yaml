apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 10-config.yaml
  - 20-postgres.yaml
  - 30-redis.yaml
  - 40-app.yaml
  - 50-backup.yaml
  - 60-ingress.yaml
configMapGenerator:
  # its name changes with its content, so a change restarts sure-web
  - name: sure-patches
    namespace: finance
    files:
      - patches/homelab_statements_controller.rb
      - patches/homelab_statements_routes.rb
secretGenerator:
  - name: sure-secrets
    namespace: finance
    envs: [secrets.env]
    options:
      disableNameSuffixHash: true
