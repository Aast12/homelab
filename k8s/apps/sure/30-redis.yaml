apiVersion: apps/v1
kind: Deployment
metadata:
  name: sure-redis
  namespace: finance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sure-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sure-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec: { command: [redis-cli, ping] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: sure-redis
  namespace: finance
spec:
  selector:
    app.kubernetes.io/name: sure-redis
  ports:
    - name: redis
      port: 6379
