apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sure-storage
  namespace: finance
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sure-web
  namespace: finance
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sure-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sure-web
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:17
          command: [sh, -c, 'until pg_isready -h sure-postgres -p 5432; do sleep 2; done']
      containers:
        - name: web
          image: ghcr.io/aast12/homelab-sure:0.7.6-hotfix.1-1   # Sure plus the statement API, from images/sure
          envFrom:
            - configMapRef: { name: sure-config }
            - secretRef:    { name: sure-secrets }
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - { name: storage, mountPath: /rails/storage }
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: 60          # first boot runs database migrations
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits:   { memory: 1Gi }
      volumes:
        - name: storage
          persistentVolumeClaim: { claimName: sure-storage }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sure-worker
  namespace: finance
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sure-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sure-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/aast12/homelab-sure:0.7.6-hotfix.1-1   # Sure plus the statement API, from images/sure
          args: [bundle, exec, sidekiq]
          envFrom:
            - configMapRef: { name: sure-config }
            - secretRef:    { name: sure-secrets }
          volumeMounts:
            - { name: storage, mountPath: /rails/storage }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits:   { memory: 1Gi }
      volumes:
        - name: storage
          persistentVolumeClaim: { claimName: sure-storage }
---
apiVersion: v1
kind: Service
metadata:
  name: sure-web
  namespace: finance
spec:
  selector:
    app.kubernetes.io/name: sure-web
  ports:
    - name: http
      port: 80
      targetPort: http
