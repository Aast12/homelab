apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sure
  namespace: finance
spec:
  ingressClassName: traefik
  tls:
    - hosts: [sure.lab.alamst.me]
  rules:
    - host: sure.lab.alamst.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sure-web
                port:
                  name: http
