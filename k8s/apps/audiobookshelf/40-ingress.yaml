apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: audiobookshelf
  namespace: media
spec:
  ingressClassName: traefik
  tls:
    - hosts: [books.lab.alamst.me]
  rules:
    - host: books.lab.alamst.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: audiobookshelf
                port:
                  name: http
