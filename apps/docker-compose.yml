services:
  wealthfolio:
    image: afadil/wealthfolio:latest
    container_name: wealthfolio
    environment:
      WF_DB_PATH: ${WF_DB_PATH}
      WF_SECRET_KEY: ${WF_SECRET_KEY}
      WF_AUTH_PASSWORD_HASH: ${WF_AUTH_PASSWORD_HASH}
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wealthfolio.rule=Host(`wealth.lab.alamst.me`)"
      - "traefik.http.routers.wealthfolio.entrypoints=websecure"
      - "traefik.http.routers.wealthfolio.tls.certresolver=cloudflare"
      - "traefik.http.services.wealthfolio.loadbalancer.server.port=8088"
    volumes:
      - /data/wealthfolio:/data
  miniflux:
    image: miniflux/miniflux:latest
    depends_on:
      db:
        condition: service_healthy
    networks: 
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.miniflux.rule=Host(`miniflux.lab.alamst.me`)"
      - "traefik.http.routers.miniflux.entrypoints=websecure"
      - "traefik.http.routers.miniflux.tls=true"
      - "traefik.http.routers.miniflux.tls.certresolver=cloudflare"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/miniflux?sslmode=disable
      - RUN_MIGRATIONS=1
      - CREATE_ADMIN=1
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=miniflux
    networks: 
      - proxy
    volumes:
      - miniflux-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      start_period: 30s

volumes:
  miniflux-db:
    external: true
    name: core_miniflux-db

networks:
  proxy:
    external: true
