http:
  routers:
    homeassistant:
      rule: "Host(`ha.lab.alamst.me`)" 
      entryPoints:
        - websecure
      service: homeassistant
      tls:
        certResolver: cloudflare 
    audiobookshelf:
      rule: "Host(`books.lab.alamst.me`)"
      service: audiobookshelf
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare
    upsnap:
      rule: "Host(`upsnap.lab.alamst.me`)"
      service: upsnap 
      entryPoints:
        - websecure
      tls:
        certResolver: cloudflare

  services:
    homeassistant:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8123"
    audiobookshelf:
      loadBalancer:
        servers:
          - url: "http://192.168.0.180:13378"
    upsnap:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5173"
