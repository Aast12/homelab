
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# No `http:` block: Home Assistant now keeps its HTTP settings in .storage/http,
# edited under Settings > System > Network, and ignores YAML after importing it
# once. Behind Traefik it needs: reverse proxy on, trusted proxies 172.16.0.0/12
# (Docker's default pool for bridge networks, where Traefik's requests come from).

recorder:
  db_url: sqlite:////config/db_storage/home-assistant_v2.db

bluetooth:

