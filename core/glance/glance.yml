pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday

      - size: full
        widgets:
          - type: search
            autofocus: true

          - type: monitor
            cache: 1m
            title: Apps
            sites:
              - title: Home Assistant 
                url: https://ha.lab.alamst.me/
                allow-insecure: true
                icon: si:homeassistant
              - title: miniflux 
                url: https://miniflux.lab.alamst.me/
                allow-insecure: true
                icon: si:rss
              - title: Wealthfolio 
                url: https://wealth.lab.alamst.me/
                allow-insecure: true
                icon: sh:wealthfolio
              - title: Audiobookshelf
                url: https://books.lab.alamst.me/
                allow-insecure: true
                icon: si:audiobookshelf
              - title: Jellyfin
                url: https://jellyfin.lab.alamst.me/
                allow-insecure: true
                icon: si:jellyfin
              - title: Jellyseerr
                url: https://jellyseerr.lab.alamst.me/
                allow-insecure: true
                icon: sh:jellyseerr

          - type: monitor
            cache: 1m
            title: Admin
            sites:
              - title: traefik 
                url: https://traefik.lab.alamst.me/
                allow-insecure: true
                alt-status-codes:
                  - 401
                icon: si:traefikproxy
              - title: Upsnap
                url: https://upsnap.lab.alamst.me/
                allow-insecure: true
                icon: sh:upsnap

          - type: monitor
            cache: 1m
            title: Media
            sites:
              - title: Sonarr
                url: https://sonarr.lab.alamst.me/
                allow-insecure: true
                icon: si:sonarr
              - title: Radarr
                url: https://radarr.lab.alamst.me/
                allow-insecure: true
                icon: si:radarr
              - title: Lidarr
                url: https://lidarr.lab.alamst.me/
                allow-insecure: true
                icon: sh:lidarr
              - title: Bazarr
                url: https://bazarr.lab.alamst.me/
                allow-insecure: true
                icon: sh:bazarr
              - title: Prowlarr
                url: https://prowlarr.lab.alamst.me/
                allow-insecure: true
                icon: sh:prowlarr


          - type: bookmarks
            groups:
              - title: General
                links:
                  - title: Proton Mail 
                    url: https://mail.proton.me/u/2/inbox
                  - title: Amazon
                    url: https://www.amazon.com.mx/
                  - title: Github
                    url: https://github.com/

      - size: small 
        widgets:
          - type: weather
            location: Monterrey, Mexico 
            units: metric 
            hour-format: 24h 
            # hide-location: true

          - type: markets
            markets:
              - symbol: SPY
                name: S&P 500
              - symbol: BTC-USD
                name: Bitcoin
              - symbol: NVDA
                name: NVIDIA
              - symbol: AAPL
                name: Apple
              - symbol: MSFT
                name: Microsoft

          - type: releases
            cache: 1d
            # Without authentication the Github API allows for up to 60 requests per hour. You can create a
            # read-only token from your Github account settings and use it here to increase the limit.
            # token: ...
            repositories:
              - glanceapp/glance
              - go-gitea/gitea
              - immich-app/immich
              - syncthing/syncthing

