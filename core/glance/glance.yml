theme:
  background-color: 50 1 6
  primary-color: 24 97 58
  negative-color: 209 88 54

pages:
  - name: Home
    columns:
      - size: small
        widgets:
          - type: calendar
            first-day-of-week: monday

          - type: to-do

      - size: full
        widgets:
          - type: search
            autofocus: true

          - type: split-column
            widgets:
              - type: monitor
                cache: 1m
                title: Apps
                sites:
                  - title: Home Assistant 
                    url: https://ha.lab.alamst.me/
                    allow-insecure: true
                    icon: si:homeassistant
                  - title: miniflux 
                    url: https://miniflux.lab.alamst.me/
                    allow-insecure: true
                    icon: si:rss
                  - title: Wealthfolio 
                    url: https://wealth.lab.alamst.me/
                    allow-insecure: true
                    icon: sh:wealthfolio
                  - title: Audiobookshelf
                    url: https://books.lab.alamst.me/
                    allow-insecure: true
                    icon: si:audiobookshelf
                  - title: Jellyfin
                    url: https://jellyfin.lab.alamst.me/
                    allow-insecure: true
                    icon: si:jellyfin
                  - title: Jellyseerr
                    url: https://jellyseerr.lab.alamst.me/
                    allow-insecure: true
                    icon: sh:jellyseerr
              - type: bookmarks
                groups:
                  - title: General
                    links:
                      - title: Proton Mail 
                        url: https://mail.proton.me/u/2/inbox
                      - title: Github
                        url: https://github.com/
                      - title: Github
                        url: https://github.com/
                      - title: Amazon
                        url: https://www.amazon.com.mx/


      - size: small 
        widgets:
          - type: weather
            location: Monterrey, Mexico 
            units: metric 
            hour-format: 24h 

          - type: markets
            markets:
              - symbol: SPY
                name: S&P 500
              - symbol: VT
                name: Vanguard Total
              - symbol: BTC-USD
                name: Bitcoin
              - symbol: NVDA
                name: NVIDIA
              - symbol: AAPL
                name: Apple
              - symbol: MSFT
                name: Microsoft

  - name: Admin
    columns:
      - size: small
        widgets:
          - type: server-stats
            servers:
              - type: local
                name: Raspberry

      - size: full
        widgets:
          - type: search
            autofocus: true

          - type: monitor
            cache: 1m
            title: Admin
            sites:
              - title: traefik 
                url: https://traefik.lab.alamst.me/
                allow-insecure: true
                alt-status-codes:
                  - 401
                icon: si:traefikproxy
              - title: Upsnap
                url: https://upsnap.lab.alamst.me/
                allow-insecure: true
                icon: sh:upsnap

          - type: monitor
            cache: 1m
            title: Media
            sites:
              - title: Sonarr
                url: https://sonarr.lab.alamst.me/
                allow-insecure: true
                icon: si:sonarr
              - title: Radarr
                url: https://radarr.lab.alamst.me/
                allow-insecure: true
                icon: si:radarr
              - title: Lidarr
                url: https://lidarr.lab.alamst.me/
                allow-insecure: true
                icon: sh:lidarr
              - title: Bazarr
                url: https://bazarr.lab.alamst.me/
                allow-insecure: true
                icon: sh:bazarr
              - title: Prowlarr
                url: https://prowlarr.lab.alamst.me/
                allow-insecure: true
                icon: sh:prowlarr
              - title: QBittorrent
                url: https://qb.lab.alamst.me/
                allow-insecure: true
                icon: si:qbittorrent

      - size: small 
        widgets:

          - type: releases
            cache: 1d
            repositories:
              - glanceapp/glance
              - jellyfin/jellyfin
              - home-assistant/core
              - syncthing/syncthing

