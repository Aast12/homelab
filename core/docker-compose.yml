services:
  blocky:
    image: spx01/blocky
    container_name: blocky
    restart: unless-stopped
    hostname: blocky-hostname
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "4000:4000/tcp"
    environment:
      - TZ=America/Monterrey 
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./blocky/config.yml:/app/config.yml:ro 
  traefik:
    image: "traefik:v3.4"
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway" 
    networks: 
      - proxy
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    environment:
      # create this token at dash.cloudflare.com/profile/api-tokens
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN} 
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/dynamic:ro 
      - /data/traefik/letsencrypt:/letsencrypt
    command:
      # EntryPoints
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.http.tls=true"
      # EntryPoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      
      # Providers
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=proxy"
      - "--providers.file.directory=/dynamic" # Tells Traefik to read our external config
      - "--providers.file.watch=true"

      # API & Dashboard
      - "--api.dashboard=true"

      # Observability 
      - "--log.level=ERROR"
      - "--accesslog=true"

      # === CLOUDFLARE DNS CHALLENGE SETUP ===
      - "--certificatesresolvers.cloudflare.acme.dnschallenge=true"
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare"
      # Delay is sometimes needed for DNS propagation, 45s is safe
      - "--certificatesresolvers.cloudflare.acme.dnschallenge.delaybeforecheck=45" 
      - "--certificatesresolvers.cloudflare.acme.email=alamst@proton.me"
      - "--certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json"

    labels:
      - "traefik.enable=true"
      # Dashboard Router
      - "traefik.http.routers.dashboard.rule=Host(`traefik.lab.alamst.me`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls.certresolver=cloudflare" # Must match resolver name above
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
      # Middleware
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=admin:$$apr1$$N0gCuYjg$$F.GHIFE8sJaKJJL5aK.KA."
  glance:
    container_name: glance
    image: glanceapp/glance
    restart: unless-stopped
    volumes:
      - ./glance:/app/config
    networks: 
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.glance.rule=Host(`lab.alamst.me`)"
      - "traefik.http.routers.glance.entrypoints=websecure"
      - "traefik.http.routers.glance.tls=true"
      - "traefik.http.routers.glance.tls.certresolver=cloudflare"
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:latest"
    volumes:
      - ./homeassistant:/config
      - /data/homeassistant:/config/db_storage
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: America/Monterrey
  upsnap:
    container_name: upsnap
    image: ghcr.io/seriousm4x/upsnap:5
    network_mode: host
    restart: unless-stopped
    volumes:
      - /data/upsnap:/app/pb_data
  synapse:
    container_name: synapse
    image: ghcr.io/element-hq/synapse:latest
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - /data/synapse:/data
    environment:
      SYNAPSE_SERVER_NAME: lab.alamst.me
      SYNAPSE_REPORT_STATS: "no"
    labels:
      - "traefik.enable=true"
      # Client + federation API on matrix subdomain
      - "traefik.http.routers.synapse.rule=Host(`matrix.lab.alamst.me`)"
      - "traefik.http.routers.synapse.entrypoints=websecure"
      - "traefik.http.routers.synapse.tls=true"
      - "traefik.http.routers.synapse.tls.certresolver=cloudflare"
      - "traefik.http.services.synapse.loadbalancer.server.port=8008"
      # Federation delegation: lab.alamst.me/.well-known/matrix/* -> synapse
      - "traefik.http.routers.synapse-wk.rule=Host(`lab.alamst.me`) && PathPrefix(`/.well-known/matrix/`)"
      - "traefik.http.routers.synapse-wk.entrypoints=websecure"
      - "traefik.http.routers.synapse-wk.tls=true"
      - "traefik.http.routers.synapse-wk.tls.certresolver=cloudflare"
      - "traefik.http.routers.synapse-wk.priority=100"
      - "traefik.http.routers.synapse-wk.service=synapse"

networks:
  proxy:
    name: proxy
